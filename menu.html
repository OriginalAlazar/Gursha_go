<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Menu | GurshaGO</title>
  <link rel="stylesheet" href="css/menu.css" />
</head>
<body>

  <header class="nav-bar">
    <h2 id="restaurantName">Menu</h2>
    <div class="cart-counter">
      🛒 <span id="cartCount">0</span>
    </div>
  </header>

  <main class="menu-container">

    <!-- Category Tabs -->
    <div class="category-tabs">
      <button class="tab active" data-category="All">All</button>
      <button class="tab" data-category="Mains">Mains</button>
      <button class="tab" data-category="Sides">Sides</button>
      <button class="tab" data-category="Drinks">Drinks</button>
    </div>

    <!-- Menu Grid -->
    <div id="menuList" class="menu-grid"></div>
  </main>

  <div class="cart-bar">
    <button onclick="goToCart()">Go to Cart</button>
  </div>

  <script src="js/firebase.js" type="module"></script>
  <script src="js/menu.js" type="module"></script>
</body>
</html>
