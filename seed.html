<!DOCTYPE html>
<html>

  <meta charset="UTF-8">
  <title>Firestore Seeder</title>
</head>
<body>
  <h2>Firestore Seed Data</h2>
  <button onclick="seedData()">Seed Database</button>

  <script type="module">
    import "./js/firebase.js";
    import {
      collection,
      doc,
      setDoc,
      addDoc,

    window.seedData = async function () {

          {

          {

            name: "Roma Pizza Owner",

            role: "restaurant"
          }
        ];

        for (const user of users) {
          await setDoc(doc(db, "users", user.id), {

          },
          {

            name: "Burger Hub",

          }

        for (const r of restaurants) {
          await setDoc(doc(db, "restaurants", r.id), {
            name: r.name,

        /* ================= MENU ITEMS ================= */
        const menuItems = [
          // Addis Kitchen
          {
            restaurantId: "rest_001",
            name: "Doro Wat",

          {

            price: 180,

            available: true
          },
          {

            available: true
          },
          {
            restaurantId: "rest_001",
            name: "Tej",
            price: 90,

          },

            available: true

          {
            restaurantId: "rest_002",

            price: 350,

            available: true
          },
          {
            restaurantId: "rest_002",
            name: "Garlic Bread",
            price: 120,
            category: "Sides",
            available: true
          },
          {
            restaurantId: "rest_002",
            name: "Coca Cola",
            price: 50,
            category: "Drinks",
            available: true
          }
        ];

        for (const item of menuItems) {
          await addDoc(collection(db, "menuItems"), {
            ...item,
            createdAt: serverTimestamp()
          });
        }

        /* ================= ORDERS ================= */
        const orders = [
          {
            customerId: "cust_001",
            restaurantId: "rest_001",
            items: [
              { name: "Doro Wat", qty: 1, price: 250 },
              { name: "Tej", qty: 2, price: 90 }
            ],
            total: 430,
            status: "Preparing"
          },
          {
            customerId: "cust_002",
            restaurantId: "rest_002",
            items: [
              { name: "Pepperoni Pizza", qty: 1, price: 350 },
              { name: "Coca Cola", qty: 2, price: 50 }
            ],
            total: 450,
            status: "Completed"
          }
        ];

        for (const order of orders) {
          await addDoc(collection(db, "orders"), {
            ...order,
            createdAt: serverTimestamp()
          });
        }

        alert("✅ Firestore seeded successfully!");
      } catch (err) {
        console.error(err);
        alert("❌ Seeding failed");

  </script>
</body>
</html>
