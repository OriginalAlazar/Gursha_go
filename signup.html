<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | GurshaGO</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>

<body class="auth-page">

  <main class="auth-wrapper">
    <div class="auth-container">

      <img src="images/logo.jpg" alt="GurshaGO Logo" class="auth-logo" />

      <h2>Create Account</h2>
      <p class="auth-subtitle">Join GurshaGO and start ordering today</p>

      <input type="text" id="name" placeholder="Full name" />
      <input type="email" id="email" placeholder="Email address" />
      <input type="password" id="password" placeholder="Password" />
      <input type="password" id="confirmPassword" placeholder="Confirm password" />

      <!-- Role Selection -->
      <div class="role-group">
        <label class="role-card">
          <input type="radio" name="role" value="customer" checked />
          <div class="role-content">
            <span class="role-icon">👤</span>
            <span class="role-title">Customer</span>
            <span class="role-desc">Order food from restaurants</span>
          </div>
        </label>

        <label class="role-card">
          <input type="radio" name="role" value="restaurant" />
          <div class="role-content">
            <span class="role-icon">🍽</span>
            <span class="role-title">Restaurant Owner</span>
            <span class="role-desc">Manage menu & orders</span>
          </div>
        </label>
      </div>

      <button onclick="signup()">Create Account</button>

      <div class="divider">
        <span>OR</span>
      </div>

      <button class="google-btn" onclick="googleLogin()">
        Sign up with Google
      </button>

      <div id="error" class="error"></div>

      <div class="auth-links">
        <p>Already have an account? <a href="login.html">Login</a></p>
      </div>

    </div>
  </main>

  <script src="js/firebase.js" type="module"></script>
  <script src="js/auth.js" type="module"></script>
</body>
</html>
