<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Restaurant Orders | GurshaGO</title>
  <link rel="stylesheet" href="css/restaurant-orders.css" />
</head>
<body>

  <header class="nav-bar">
    <h2>🍽 Orders</h2>
    <a href="restaurant-dashboard.html">Back</a>
  </header>

  <main class="auth-container" style="max-width: 800px;">
    <div class="tabs">
      <button class="tab-btn active" onclick="loadOrders('Pending', this)">New</button>
      <button class="tab-btn" onclick="loadOrders('Preparing', this)">Preparing</button>
      <button class="tab-btn" onclick="loadOrders('Delivered', this)">Completed</button>
    </div>

    <div id="ordersList" class="orders-list">
      <p>Loading orders...</p>
    </div>
  </main>

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/restaurant-orders.js"></script>
</body>
</html>
