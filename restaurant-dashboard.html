<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Restaurant Dashboard | GurshaGO</title>
  <link rel="stylesheet" href="css/restaurant-dashboard.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="nav-bar">
    <div class="nav-left">
      <h2>🍽 GurshaGO</h2>
      <span class="page-title">Restaurant Dashboard</span>
    </div>

    <nav class="nav-links">
      <a href="restaurant-dashboard.html">Dashboard</a>
      <a href="restaurant-menu.html">Menu</a>
      <a href="restaurant-orders.html">Orders</a>
      <a href="login.html" class="logout">Logout</a>
    </nav>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="dashboard-container">
    <div class="status-toggle">
      <label>
        <input type="checkbox" id="onlineToggle" checked />
        Online
      </label>
    </div>

    <div class="stats">
      <div class="stat-box">
        <h3 id="todayOrders">0</h3>
        <p>Today's Orders</p>
      </div>
      <div class="stat-box">
        <h3 id="todayRevenue">0 ETB</h3>
        <p>Today's Revenue</p>
      </div>
    </div>

    <div class="links">
      <button onclick="location.href='restaurant-menu.html'">Manage Menu</button>
      <button onclick="location.href='restaurant-orders.html'">View Orders</button>
    </div>

    <div class="orders-list" id="recentOrders">
      <h4>Recent Orders</h4>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="dashboard-footer">
    <p>© 2026 GurshaGO • Restaurant Partner Panel</p>
    <div class="footer-links">
      <a href="restaurant-dashboard.html">Dashboard</a>
      <a href="restaurant-menu.html">Menu</a>
      <a href="restaurant-orders.html">Orders</a>
    </div>
  </footer>

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/restaurant-dashboard.js"></script>
</body>
</html>
