<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Manage Menu | GurshaGO</title>
  <link rel="stylesheet" href="css/restaurant-menu.css" />
</head>
<body>

  <header class="nav-bar">
    <h2>🍽 Manage Menu</h2>
    <a href="restaurant-dashboard.html">Back</a>
  </header>

  <main class="menu-container">
    <div class="menu-form">
      <input id="itemName" placeholder="Item Name" />
      <input id="itemPrice" type="number" placeholder="Price (ETB)" />
      <select id="itemCategory">
        <option>Mains</option>
        <option>Sides</option>
        <option>Drinks</option>
      </select>
      <button onclick="addItem()">Add Item</button>
    </div>

    <div id="menuItems" class="menu-list">
      <p>Loading menu...</p>
    </div>
  </main>

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/restaurant-menu.js"></script>
</body>
</html>
