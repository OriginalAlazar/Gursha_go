<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home | GurshaGO</title>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/home.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="navbar">
    <div class="nav-left">
      <img src="images/logo.jpg" class="logo" alt="GurshaGO" />
      <div>
        <h3>GurshaGO</h3>
        <span class="location">📍 Addis Ababa</span>
      </div>
    </div>

    <nav class="nav-right">
      <a href="home.html" class="nav-link active">Home</a>
      <a href="orders.html" class="nav-link">Orders</a>
      <a href="cart.html" class="cart-btn">
        🛒 <span id="cartCount">0</span>
      </a>
    </nav>
  </header>

  <!-- ===== SEARCH ===== -->
  <section class="search-section">
    <input
      id="searchInput"
      type="text"
      placeholder="Search restaurants or dishes..."
    />
  </section>

  <!-- ===== CONTENT ===== -->
  <main class="content">
    <h2 class="section-title">Popular Restaurants</h2>
    <div id="restaurantList" class="restaurant-grid"></div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="footer-top">
      <h4>GurshaGO</h4>
      <p>Order food from your favorite local restaurants.</p>
    </div>

    <div class="footer-links">
      <a href="home.html">Home</a>
      <a href="orders.html">Orders</a>
      <a href="cart.html">Cart</a>
      <a href="login.html">Logout</a>
    </div>

    <p class="footer-copy">© 2026 GurshaGO • Delivering Ethiopian flavors 🇪🇹</p>
  </footer>

  <script src="js/firebase.js" type="module"></script>
  <script src="js/home.js" type="module"></script>
</body>
</html>
